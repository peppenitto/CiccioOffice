name: Crea DMG Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: Apple-Silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: Intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Rust
        run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}

      - name: Verifica progetto
        run: python3 scripts/verify.py

      - name: Compila e crea DMG
        run: python3 scripts/build.py --target ${{ matrix.target }}

      - name: Controlla documenti
        run: python3 scripts/smoke.py --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: CiccioOffice-Mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
